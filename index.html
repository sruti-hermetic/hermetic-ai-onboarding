<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermetic AI — Account Hub</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/general-sans">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/jetbrains-mono">
<style>
:root{
  --venue-blue: oklch(0.432 0.193 267);
  --venue-blue-hover: oklch(0.380 0.176 267);
  --venue-blue-deep: oklch(0.320 0.149 267);
  --venue-blue-tint: oklch(0.965 0.017 275);
  --night-ink: oklch(0.198 0.017 257);
  --evening-slate: oklch(0.375 0.039 257);
  --mid-slate: oklch(0.556 0.040 257);
  --border-default: oklch(0.859 0.025 255);
  --border-subtle: oklch(0.926 0.013 255);
  --clean-linen: oklch(0.984 0.003 248);
  --canvas: oklch(1 0 0);
  --fresh-teal: oklch(0.620 0.104 184);
  --evening-violet: oklch(0.464 0.211 289);
  --warm-amber: oklch(0.554 0.130 59);
  --success-green: oklch(0.525 0.137 150);
  --alert-red: oklch(0.531 0.218 29);
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-full:9999px;
  --sp-2:2px; --sp-4:4px; --sp-6:6px; --sp-8:8px; --sp-10:10px; --sp-12:12px; --sp-16:16px;
  --sp-20:20px; --sp-24:24px; --sp-32:32px; --sp-40:40px; --sp-48:48px; --sp-56:56px;
  --font-sans:'General Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family: var(--font-sans); background: var(--clean-linen); color: var(--night-ink);
  letter-spacing:-0.01em; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol{ margin:0; padding:0; }
button{ font-family:inherit; }
input,select,textarea{ font-family:inherit; letter-spacing:-0.01em; }

.t-display{ font-size:24px; font-weight:600; line-height:1.3; }
.t-headline{ font-size:20px; font-weight:600; line-height:1.4; }
.t-title{ font-size:16px; font-weight:600; line-height:1.5; }
.t-body{ font-size:14px; font-weight:400; line-height:1.5; }
.t-label{ font-size:14px; font-weight:500; line-height:1.5; }
.t-caption{ font-size:12px; font-weight:400; line-height:1.5; color:var(--mid-slate); }
.t-overline{ font-size:12px; font-weight:600; line-height:1.5; text-transform:uppercase; letter-spacing:0.04em; color:var(--mid-slate); }

/* Top bar */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: var(--sp-16) var(--sp-24); border-bottom:1px solid var(--border-subtle); background:var(--canvas);
}
.brand{ display:flex; align-items:center; gap:var(--sp-8); font-weight:600; font-size:15px; }
.brand .dot{ width:8px; height:8px; border-radius:var(--radius-full); background:var(--venue-blue); }

/* App shell */
.shell{ display:grid; grid-template-columns: 320px 1fr; height: calc(100vh - 57px); }
@media (max-width:860px){ .shell{ grid-template-columns:1fr; height:auto; } .list-pane{ height:auto; } }

.list-pane{
  border-right:1px solid var(--border-subtle); background:var(--canvas);
  display:flex; flex-direction:column; overflow:hidden;
}
.list-pane-head{ padding: var(--sp-16); border-bottom:1px solid var(--border-subtle); display:flex; flex-direction:column; gap:var(--sp-10); }
.search-input{ position:relative; }
.search-input input{
  width:100%; border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding: var(--sp-8) var(--sp-12); font-size:14px; outline:none;
}
.search-input input:focus{ border-color:var(--venue-blue); box-shadow:0 0 0 3px var(--venue-blue-tint); }

.account-list{ overflow-y:auto; flex:1; }
.account-item{
  display:flex; flex-direction:column; gap:2px; padding: var(--sp-12) var(--sp-16);
  border-bottom:1px solid var(--border-subtle); cursor:pointer;
}
.account-item:hover{ background:var(--border-subtle); }
.account-item.active{ background:var(--venue-blue-tint); border-left:3px solid var(--venue-blue); padding-left:13px; }
.account-item .name{ font-size:14px; font-weight:500; color:var(--night-ink); }
.account-item .sub{ font-size:12px; color:var(--mid-slate); display:flex; gap:8px; align-items:center; }
.status-badge{ font-size:11px; font-weight:500; padding:2px 8px; border-radius:var(--radius-sm); }
.status-Discovery{ background: oklch(0.554 0.130 59 / 0.14); color:var(--warm-amber); }
.status-Configuring{ background: var(--venue-blue-tint); color:var(--venue-blue-deep); }
.status-Live{ background: oklch(0.525 0.137 150 / 0.14); color:var(--success-green); }
.empty-list{ padding: var(--sp-24) var(--sp-16); color:var(--mid-slate); font-size:13px; text-align:center; }

/* Main pane */
.main-pane{ overflow-y:auto; padding: var(--sp-32); }
@media (max-width:600px){ .main-pane{ padding: var(--sp-16); } }
.no-selection{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--mid-slate); font-size:14px; }

.account-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: var(--sp-24); gap:var(--sp-16); }
.account-header .t-display{ margin-bottom:4px; }
.account-header .meta-line{ font-size:13px; color:var(--evening-slate); display:flex; gap:12px; flex-wrap:wrap; }

/* Tabs */
.tab-nav{ display:flex; gap:var(--sp-4); border-bottom:1px solid var(--border-subtle); margin-bottom:var(--sp-24); }
.tab-btn{
  padding: var(--sp-10) var(--sp-16); font-size:14px; font-weight:500; color:var(--evening-slate);
  border:none; background:none; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab-btn.active{ color:var(--venue-blue-deep); border-bottom-color:var(--venue-blue); }
.tab-btn:disabled{ color:var(--border-default); cursor:not-allowed; }

/* Cards */
.card{ background:var(--canvas); border:1px solid var(--border-default); border-radius:var(--radius-lg); padding:var(--sp-20); margin-bottom:var(--sp-16); }
.card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--sp-12); cursor:pointer; }
.phase-num{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:var(--radius-full); background:var(--venue-blue-tint); color:var(--venue-blue-deep); font-size:11px; font-weight:600; margin-right:var(--sp-8); }
.qblock{ margin-bottom:var(--sp-16); }
.qblock:last-of-type{ margin-bottom:var(--sp-12); }
.question{ font-size:14px; font-weight:600; line-height:1.45; margin-bottom:8px; color:var(--night-ink); }
.subquestions{ list-style:none; margin:0; padding:0 0 0 var(--sp-12); border-left:2px solid var(--border-subtle); display:flex; flex-direction:column; gap:7px; }
.subquestions li{ font-size:13.5px; line-height:1.5; color:var(--evening-slate); }
textarea.notes{
  width:100%; min-height:70px; border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:var(--sp-10) var(--sp-12); font-size:14px; outline:none; resize:vertical;
}
textarea.notes:focus{ border-color:var(--venue-blue); box-shadow:0 0 0 3px var(--venue-blue-tint); }
.save-indicator{ font-size:11px; color:var(--mid-slate); margin-top:4px; height:14px; }
.save-indicator.saved{ color:var(--success-green); }

/* Checklist */
.checklist-item{ display:flex; gap:var(--sp-10); align-items:flex-start; padding: var(--sp-12) 0; border-bottom:1px solid var(--border-subtle); }
.checklist-item:last-child{ border-bottom:none; }
.checklist-item input[type=checkbox]{ margin-top:3px; width:16px; height:16px; accent-color:var(--venue-blue); flex-shrink:0; }
.checklist-item .item-body{ flex:1; }
.section-head{ font-size:13px; font-weight:600; letter-spacing:0.02em; text-transform:uppercase; color:var(--evening-slate); margin-top:var(--sp-20); padding-top:var(--sp-16); border-top:1px solid var(--border-subtle); }
.card > .section-head:first-of-type{ margin-top:var(--sp-12); }
.section-intro{ font-size:13px; line-height:1.55; color:var(--evening-slate); margin-top:6px; }
.checklist-intro{ font-size:13px; line-height:1.55; color:var(--evening-slate); padding-bottom:var(--sp-12); margin-bottom:var(--sp-4); border-bottom:1px solid var(--border-subtle); }
.checklist-item .item-label{ font-size:14px; font-weight:500; color:var(--night-ink); }
.checklist-item .item-desc{ font-size:13px; line-height:1.5; color:var(--evening-slate); margin-top:3px; }
.checklist-item.checked .item-desc{ color:var(--mid-slate); }
.checklist-item.checked .item-label{ color:var(--mid-slate); }
.item-tag{ display:inline-block; margin-left:var(--sp-8); font-size:10.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
  padding:2px 6px; border-radius:var(--radius-sm); background:oklch(0.554 0.130 59 / 0.14); color:var(--warm-amber); vertical-align:1.5px; white-space:nowrap; }
.checklist-item.checked .item-tag{ opacity:0.65; }
.checklist-item .item-bullets{ margin:6px 0 0; padding-left:18px; }
.checklist-item .item-bullets li{ font-size:13px; line-height:1.5; color:var(--evening-slate); }
.checklist-item.checked .item-bullets li{ color:var(--mid-slate); }
.tone-examples{ display:flex; flex-direction:column; gap:var(--sp-8); margin-top:var(--sp-10); }
.tone-example{ margin:0; background:var(--clean-linen); border:1px solid var(--border-subtle); border-radius:var(--radius-md);
  padding:var(--sp-10) var(--sp-12); font-size:13.5px; line-height:1.55; color:var(--night-ink); font-style:italic; }
.select-all{ display:flex; gap:var(--sp-10); align-items:center; padding:var(--sp-10) 0; border-bottom:1px solid var(--border-subtle); cursor:pointer; }
.select-all input[type=checkbox]{ width:16px; height:16px; accent-color:var(--venue-blue); flex-shrink:0; }
.select-all span{ font-size:12px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--evening-slate); }

/* Buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-8); border-radius:var(--radius-md); border:1px solid transparent; font-size:14px; font-weight:500; padding:var(--sp-10) var(--sp-20); cursor:pointer; }
.btn-primary{ background:var(--venue-blue); color:var(--canvas); }
.btn-primary:hover{ background:var(--venue-blue-hover); }
.btn-primary:disabled{ background:var(--border-default); color:var(--mid-slate); cursor:not-allowed; }
.btn-ghost{ background:transparent; color:var(--evening-slate); border-color:var(--border-default); }
.btn-ghost:hover{ background:var(--border-subtle); }
.btn-sm{ padding:var(--sp-6) var(--sp-12); font-size:13px; }

/* Modal */
.modal-overlay{ position:fixed; inset:0; background: oklch(0.198 0.017 257 / 0.4); display:none; align-items:center; justify-content:center; z-index:50; }
.modal-overlay.show{ display:flex; }
.modal{ background:var(--canvas); border-radius:var(--radius-xl); padding:var(--sp-24); width:420px; max-width:90vw; max-height:85vh; overflow-y:auto; }
.modal .t-headline{ margin-bottom:var(--sp-16); }
.field{ margin-bottom:var(--sp-16); }
.field label{ display:block; font-size:14px; font-weight:500; margin-bottom:6px; }
.field input, .field select{ width:100%; border:1px solid var(--border-default); border-radius:var(--radius-md); padding:var(--sp-10) var(--sp-12); font-size:14px; outline:none; }
.field input:focus{ border-color:var(--venue-blue); box-shadow:0 0 0 3px var(--venue-blue-tint); }
.loc-row{ display:flex; gap:8px; margin-bottom:8px; }
.loc-row input{ flex:1; }
.modal-actions{ display:flex; justify-content:flex-end; gap:var(--sp-8); margin-top:var(--sp-20); }

.badge{ font-size:12px; font-weight:500; padding:2px 8px; border-radius:var(--radius-sm); background:var(--venue-blue-tint); color:var(--venue-blue-deep); }
.status-select{ font-size:13px; border:1px solid var(--border-default); border-radius:var(--radius-md); padding:6px 10px; }

.divider{ height:1px; background:var(--border-subtle); margin: var(--sp-20) 0; }
.config-embed{ display:flex; flex-direction:column; gap:var(--sp-12); }
.config-embed-bar{ display:flex; align-items:center; justify-content:flex-end; gap:var(--sp-12); flex-wrap:wrap; }
.config-embed iframe{ width:100%; height:calc(100vh - 220px); min-height:520px; border:1px solid var(--border-default);
  border-radius:var(--radius-lg); background:var(--canvas); }
.link-out{ font-size:13px; font-weight:500; color:var(--venue-blue); text-decoration:none; white-space:nowrap; }
.link-out:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Hermetic AI — Account Hub</div>
  <button class="btn btn-primary btn-sm" id="btnNewAccount">+ New account</button>
</div>

<div class="shell">
  <div class="list-pane">
    <div class="list-pane-head">
      <div class="search-input"><input type="text" id="searchInput" placeholder="Search accounts…"></div>
    </div>
    <div class="account-list" id="accountList"></div>
  </div>
  <div class="main-pane" id="mainPane">
    <div class="no-selection">Select an account, or create a new one.</div>
  </div>
</div>

<!-- New account modal -->
<div class="modal-overlay" id="newAccountModal">
  <div class="modal">
    <div class="t-headline">New account</div>
    <div class="field">
      <label>Account name</label>
      <input type="text" id="newAccountName" placeholder="e.g. The Ivy Group">
    </div>
    <div class="field">
      <label>CS rep</label>
      <input type="text" id="newAccountRep" placeholder="Who's running this account?">
    </div>
    <div class="field">
      <label>Locations</label>
      <div id="newAccountLocs"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddLocRow">+ Add location</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelNew">Cancel</button>
      <button class="btn btn-primary" id="btnCreateAccount">Create account</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   HERMETIC AI — ACCOUNT HUB
   Internal CS tool: account list/search, discovery-call script
   with per-phase notes, pre/postcall checklists.
   Talks to the same Apps Script Web App as the onboarding form.
   ============================================================ */

const CONFIG = {
  // The onboarding configuration form, embedded in the Configuration form tab.
  CONFIG_FORM_URL: "config-form.html",
  ENDPOINT_URL: "https://script.google.com/macros/s/AKfycbwIRubWd-gnfi6bB19Wl4z8vxV_KyS1-0IB6q__YX4ETZVWGxJ80UmJMvqReCSMyg5UZw/exec"
};

/* ---------------- Discovery call script content ---------------- */
/* Sourced directly from the CS discovery call guide. */
const DISCOVERY_SCRIPT = [
  {
    id: "beforeYouStart",
    title: "Before you start · Locations & structure",
    questions: [
      { q: "How do your locations differ from each other?", subs: [
        "Is the menu the same across all locations, or does each one have its own?",
        "Is pricing the same everywhere, or does it vary by market?",
        "Are hours the same at every location, or set locally?",
        "Is there a flagship location that follows different rules or has capabilities the others don't?",
        "Is the tone and voice you use with guests consistent across locations?",
        "Are policies like cancellations and accessibility uniform, or set per location?",
        "How would you describe each venue — restaurant, event space, eatertainment, or bar-forward?"
      ]}
    ]
  },
  {
    id: "phase1", title: "Phase 1 · Lead in",
    questions: [
      { q: "How does a lead come in today?", subs: [
        "Which channels do leads arrive through — a form, email, phone, text, or something else?",
        "Would you be interested in Mia Voice handling your inbound calls? (multi-location only)",
        "Before a contract or quote, do you always, sometimes, or never do a call or site visit — or do you go straight to paperwork?",
        "If always or sometimes — what makes a lead qualify for that call or visit?"
      ]}
    ]
  },
  {
    id: "phase2", title: "Phase 2 · Qualify & fit",
    questions: [
      { q: "Today, how do you decide which coordinator gets which lead?", subs: [
        "Is it by location, by date, round robin, or based on group size, event date, or contact preference?"
      ]},
      { q: "What's your minimum headcount for a private event?", subs: [
        "What's the precise number?"
      ]},
      { q: "What are your regular operating days and hours?", subs: [
        "Do your private-event hours differ from your regular hours?",
        "Do you need buffer time before or after an event?"
      ]},
      { q: "At what point does a coordinator loop in a manager?", subs: [] },
      { q: "Think of your best event coordinator — how would they handle each of these?", subs: [
        "A party comes in below your minimum private-event headcount — do they book it as a regular reservation or turn it away?",
        "The date the guest wants is fully booked — what exactly would they say?",
        "The guest pushes back on price — do they hold firm, give a range, or escalate to a manager?",
        "If one location is full, do they offer a sister venue instead — and which ones? (multi-location only)"
      ]}
    ]
  },
  {
    id: "phase3", title: "Phase 3 · Propose & price",
    questions: [
      { q: "How do you build and send a proposal today?", subs: [
        "What do you build it in — email, a PDF, an e-sign platform, or something else?",
        "How do you follow up, and how long do you wait if the guest goes quiet?",
        "Who can approve a discount — the coordinator, or does it need a manager?"
      ]}
    ]
  },
  {
    id: "phase4", title: "Phase 4 · Contract & deposit",
    questions: [
      { q: "How do contracts and deposits work today?", subs: [
        "Do you send contracts through an e-sign tool or over email?",
        "How much is the deposit, and when is it due?",
        "When is the final balance due relative to the event, and is it collected the same way as the deposit or differently?",
        "What's your cancellation and refund policy?",
        "How do you track and chase unsigned contracts or unpaid deposits today?"
      ]}
    ]
  },
  {
    id: "phase5", title: "Phase 5 · Plan & prep",
    questions: [
      { q: "How does an event go from signed contract to final BEO?", subs: [
        "What format is your BEO in, and who fills it out?",
        "How close to the event do you lock final counts, allergies, and A/V?",
        "How much lead time does the kitchen need for menu changes?",
        "Do you build menus from a template, or fresh each time?",
        "Who signs off on a menu before it goes out to the guest?",
        "Does your cancellation policy still apply once planning is underway, or does it change?",
        "Are outside vendors brought in by you or by the guest, and do you require a COI?",
        "Would you be interested in generating menus automatically from the final BEO?"
      ]}
    ]
  },
  {
    id: "phase6", title: "Phase 6 · Day of the event",
    questions: [
      { q: "What do guests usually need on the day itself?", subs: [
        "What do guests ask about most — parking, arrival, timing, what to bring?",
        "Who is the on-site contact fielding guest questions today?",
        "How do last-minute changes get to the kitchen or the room?"
      ]}
    ]
  },
  {
    id: "phase7", title: "Phase 7 · After the event",
    questions: [
      { q: "What happens after an event ends today — for guests who booked, and for guests who didn't?", subs: [
        "How long after the event do you reach out, and how?",
        "Do you send a review link, a survey, or do a personal check-in?",
        "For leads you lost, do you ask why they went elsewhere?",
        "What does success look like for you here?",
        "What would you want to see or track in reporting?"
      ]}
    ]
  }
];

/* The four files we ask for. They show up in the precall list and again in the
   postcall "still outstanding" section; both sides read and write the same keys,
   so ticking a document in one place ticks it in the other. */
const DOCUMENT_ITEMS = [
  { key: "rate_sheet", label: "Rate sheet",
    desc: "Per-person pricing and F&B minimums, by space or by location if they vary." },
  { key: "menus_packets", label: "Menus and private-event materials",
    desc: "Menus plus any private-event packets, decks, or venue guides they send to guests." },
  { key: "policy_doc", label: "Policy document",
    desc: "Cancellation, deposit, refund, and accessibility policies — if a written one exists." },
  { key: "room_setup", label: "Room and space setup", tag: "Tripleseat only",
    desc: "Skip this unless they use Tripleseat \u2014 if they do, a screenshot of their rooms and spaces." }
];

const PRECALL_CHECKLIST = DOCUMENT_ITEMS;

const POSTCALL_CHECKLIST = [
  {
    items: [
      { key: "booking_link", label: "If guests self-book",
        desc: "Get the actual booking link." },
      { key: "reservation_link", label: "If they offer a reservation link over a certain group size",
        desc: "Get the reservation link they offer, and the group size it kicks in at." },
      { key: "closed_dates", label: "Holidays, private buyouts, renovations \u2014 anything closed outside regular hours",
        desc: "Get the actual list of dates." },
      { key: "team_setup", label: "Team set-up",
        desc: "Get all of it: name, role title, email address." },
      { key: "tone_examples", label: "Example phrases",
        bullets: [
          "Get 1\u20133 phrases they love",
          "Get 1\u20133 phrases they never want used"
        ],
        examples: [
          "Thank you for your inquiry regarding your event on the 14th of June. Given a guest count of 120, I would be pleased to recommend our East Room, which affords the elegance and capacity your occasion warrants. Please find our floor plan and pricing enclosed, and do let me know a convenient time for a private viewing.",
          "We are so stoked to host you soon. Let us know whenever you wanna chat. No rush at all!"
        ] }
    ]
  },
  {
    heading: "Documents, if still outstanding",
    intro: "Anything from the precall list they haven't sent yet \u2014 get a firm date for each. Ticking one here ticks it on the precall list too.",
    syncWith: "precall",
    items: DOCUMENT_ITEMS
  }
];

/* Wrap-up items that close out the discovery call itself. */
const DISCOVERY_WRAPUP = [
  { key: "confirm_files", label: "Confirm every outstanding file and get a firm date for anything missing" },
  { key: "explain_test_mode", label: "Explain what \"test mode\" is and roughly how long it runs" },
  { key: "confirm_verification_call", label: "Confirm the date/time for the verification call and what to expect" }
];

/* ---------------- State ---------------- */
let accounts = [];
let selectedAccountId = null;
let selectedAccountDetail = null;
let activeMainTab = "precall"; // precall | discovery | postcall | config
let searchTerm = "";
let newAccountLocRows = 1;

/* ---------------- API helpers ---------------- */
async function apiGet(params){
  const url = CONFIG.ENDPOINT_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(body){
  const res = await fetch(CONFIG.ENDPOINT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  return res.json();
}
function endpointReady(){
  return CONFIG.ENDPOINT_URL && !CONFIG.ENDPOINT_URL.includes("PASTE_YOUR");
}

/* ---------------- Load & render account list ---------------- */
async function loadAccounts(){
  if(!endpointReady()){
    document.getElementById('accountList').innerHTML = `<div class="empty-list">Connect this page to your Apps Script Web App URL in account-hub.js first.</div>`;
    return;
  }
  const res = await apiGet({ action: "listAccounts" });
  if(res.ok){ accounts = res.accounts; renderAccountList(); }
}

function renderAccountList(){
  const list = document.getElementById('accountList');
  const filtered = accounts.filter(a =>
    !searchTerm || (a.AccountName||'').toLowerCase().includes(searchTerm.toLowerCase()) || (a.Locations||'').toLowerCase().includes(searchTerm.toLowerCase())
  );
  if(!filtered.length){
    list.innerHTML = `<div class="empty-list">${accounts.length ? 'No accounts match your search.' : 'No accounts yet — create the first one.'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(a => `
    <div class="account-item ${a.AccountID===selectedAccountId?'active':''}" data-accid="${a.AccountID}">
      <div class="name">${esc(a.AccountName)}</div>
      <div class="sub">
        <span class="status-badge status-${esc(a.Status||'Discovery')}">${esc(a.Status||'Discovery')}</span>
        <span>${esc(a.Locations || 'No locations yet')}</span>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.account-item').forEach(el => {
    el.addEventListener('click', () => selectAccount(el.dataset.accid));
  });
}

/* ---------------- Select & load a single account ---------------- */
async function selectAccount(id){
  selectedAccountId = id;
  activeMainTab = "precall";
  renderAccountList();
  document.getElementById('mainPane').innerHTML = `<div class="no-selection">Loading…</div>`;
  const res = await apiGet({ action: "getAccount", id });
  if(!res.ok){
    document.getElementById('mainPane').innerHTML = `<div class="no-selection">Couldn't load this account: ${esc(res.error||'')}</div>`;
    return;
  }
  selectedAccountDetail = res.account;
  renderMainPane();
}

/* ---------------- Main pane render ---------------- */
function renderMainPane(){
  if(!selectedAccountDetail){
    document.getElementById('mainPane').innerHTML = `<div class="no-selection">Select an account, or create a new one.</div>`;
    return;
  }
  const meta = selectedAccountDetail.meta;
  const html = `
    <div class="account-header">
      <div>
        <div class="t-display">${esc(meta.AccountName)}</div>
        <div class="meta-line">
          <span>${esc(meta.Locations || 'No locations set')}</span>
          <span>·</span>
          <span>CS rep: ${esc(meta.CSRep || '—')}</span>
        </div>
      </div>
      <select class="status-select" id="statusSelect">
        ${["Discovery","Configuring","Live"].map(s=>`<option value="${s}" ${meta.Status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="tab-nav">
      <button class="tab-btn ${activeMainTab==='precall'?'active':''}" data-tab="precall">Precall checklist</button>
      <button class="tab-btn ${activeMainTab==='discovery'?'active':''}" data-tab="discovery">Discovery call</button>
      <button class="tab-btn ${activeMainTab==='postcall'?'active':''}" data-tab="postcall">Postcall checklist</button>
      <button class="tab-btn ${activeMainTab==='config'?'active':''}" data-tab="config">Configuration form</button>
    </div>
    <div id="tabContent"></div>
  `;
  document.getElementById('mainPane').innerHTML = html;
  document.getElementById('statusSelect').addEventListener('change', async (e) => {
    await apiPost({ action: "updateAccountMeta", accountId: selectedAccountId, status: e.target.value });
    meta.Status = e.target.value;
    renderAccountList();
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeMainTab = btn.dataset.tab; renderMainPane(); });
  });
  renderTabContent();
}

function renderTabContent(){
  const el = document.getElementById('tabContent');
  if(activeMainTab === 'discovery') el.innerHTML = renderDiscoveryTab();
  else if(activeMainTab === 'precall') el.innerHTML = renderChecklistTab('precall', PRECALL_CHECKLIST);
  else if(activeMainTab === 'postcall') el.innerHTML = renderChecklistTab('postcall', POSTCALL_CHECKLIST);
  else if(activeMainTab === 'config') el.innerHTML = `
    <div class="config-embed">
      <div class="config-embed-bar">
        <a class="link-out" href="${CONFIG.CONFIG_FORM_URL}" target="_blank" rel="noopener">Open in new tab \u2197</a>
      </div>
      <iframe src="${CONFIG.CONFIG_FORM_URL}" title="Onboarding configuration form" loading="lazy"></iframe>
    </div>`;
  bindTabEvents();
}

function renderDiscoveryTab(){
  const notes = (selectedAccountDetail.data && selectedAccountDetail.data.discovery) || {};
  // Wrap-up is a plain reminder list with one shared note, saved alongside the discovery notes.
  const wrapUp = `
    <div class="card">
      <div class="card-head">
        <div class="t-title"><span class="phase-num">\u2713</span>Before you hang up</div>
      </div>
      ${DISCOVERY_WRAPUP.map(item => `
        <div class="qblock">
          <div class="question">${esc(item.label)}</div>
        </div>
      `).join('')}
      <textarea class="notes" data-phase="wrapup" placeholder="Notes from the call\u2026">${esc(notes.wrapup||'')}</textarea>
      <div class="save-indicator" data-indicator="wrapup"></div>
    </div>`;
  return DISCOVERY_SCRIPT.map((phase, i) => `
    <div class="card">
      <div class="card-head">
        <div class="t-title"><span class="phase-num">${i===0?'—':i}</span>${esc(phase.title)}</div>
      </div>
      ${phase.questions.map(qq => `
        <div class="qblock">
          <div class="question">${esc(qq.q)}</div>
          ${qq.subs.length ? `<ul class="subquestions">${qq.subs.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        </div>
      `).join('')}
      <textarea class="notes" data-phase="${phase.id}" placeholder="Notes from the call…">${esc(notes[phase.id]||'')}</textarea>
      <div class="save-indicator" data-indicator="${phase.id}"></div>
    </div>
  `).join('') + wrapUp;
}

const CHECKLIST_INTRO = {
  precall: "Everything to collect from the customer before the discovery call.",
  postcall: "Everything to collect from the customer before the verification call."
};

function isChecked_(stored, key){
  try{ return !!(stored[key] && JSON.parse(stored[key]).checked); }catch(e){ return false; }
}

function renderChecklistItem(type, stored, item){
  const checked = isChecked_(stored, item.key);
  return `
    <div class="checklist-item ${checked?'checked':''}" data-key="${item.key}">
      <input type="checkbox" data-checklist-check="${type}" data-key="${item.key}" ${checked?'checked':''}>
      <div class="item-body">
        <div class="item-label">${esc(item.label)}${item.tag ? `<span class="item-tag">${esc(item.tag)}</span>` : ''}</div>
        ${item.desc ? `<div class="item-desc">${esc(item.desc)}</div>` : ''}
        ${item.bullets ? `<ul class="item-bullets">${item.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
        ${item.examples ? `<div class="tone-examples">${item.examples.map(ex => `
          <blockquote class="tone-example">${esc(ex)}</blockquote>`).join('')}</div>` : ''}
      </div>
    </div>`;
}

function storedChecklist_(type){
  return (selectedAccountDetail.data && selectedAccountDetail.data['checklist.'+type]) || {};
}

function renderChecklistTab(type, list){
  const intro = CHECKLIST_INTRO[type] ? `<div class="checklist-intro">${esc(CHECKLIST_INTRO[type])}</div>` : '';
  // A list is either a flat array of items or an array of {heading, intro, syncWith, items}
  // sections. Each section carries its own select-all, so the outstanding-docs group toggles
  // on its own, and a section with syncWith reads and writes that checklist's storage instead.
  const sections = list[0] && list[0].items ? list : [{ items: list }];
  const body = sections.map(sec => {
    const secType = sec.syncWith || type;
    const stored = storedChecklist_(secType);
    return `
    ${sec.heading ? `<div class="section-head">${esc(sec.heading)}</div>` : ''}
    ${sec.intro ? `<div class="section-intro">${esc(sec.intro)}</div>` : ''}
    <div class="checklist-group">
      <label class="select-all">
        <input type="checkbox" data-select-all="${secType}" ${sec.items.every(it => isChecked_(stored, it.key))?'checked':''}>
        <span>Select all</span>
      </label>
      ${sec.items.map(item => renderChecklistItem(secType, stored, item)).join('')}
    </div>
  `;
  }).join('');
  return `<div class="card">${intro}${body}</div>`;
}

/* ---------------- Tab event binding ---------------- */
let noteSaveTimers = {};
function bindTabEvents(){
  // Discovery notes — debounced autosave
  document.querySelectorAll('textarea.notes').forEach(ta => {
    ta.addEventListener('input', () => {
      const phaseId = ta.dataset.phase;
      const indicator = document.querySelector(`[data-indicator="${phaseId}"]`);
      indicator.textContent = 'Saving…';
      indicator.classList.remove('saved');
      clearTimeout(noteSaveTimers[phaseId]);
      noteSaveTimers[phaseId] = setTimeout(async () => {
        await apiPost({ action: "saveDiscoveryNote", accountId: selectedAccountId, phaseId, note: ta.value });
        if(!selectedAccountDetail.data.discovery) selectedAccountDetail.data.discovery = {};
        selectedAccountDetail.data.discovery[phaseId] = ta.value;
        indicator.textContent = 'Saved';
        indicator.classList.add('saved');
      }, 700);
    });
  });

  // Checklist checkboxes
  document.querySelectorAll('[data-checklist-check]').forEach(cb => {
    cb.addEventListener('change', () => {
      applyChecked_(cb);
      syncSelectAll_(cb.closest('.checklist-group'));
      persistChecklistCheck_(cb);
    });
  });

  // Select all — every item in its own group follows the master, both ways
  document.querySelectorAll('[data-select-all]').forEach(master => {
    master.addEventListener('change', () => {
      const boxes = groupBoxes_(master.closest('.checklist-group'));
      const changed = boxes.filter(cb => cb.checked !== master.checked);
      // Flip the whole group first: saves go one request per item, so awaiting them
      // in turn would tick the boxes one by one and strand the rest if one failed.
      changed.forEach(cb => { cb.checked = master.checked; applyChecked_(cb); });
      master.indeterminate = false;
      changed.forEach(persistChecklistCheck_);
    });
  });

  // A group that loads part-checked shows an indeterminate master.
  document.querySelectorAll('.checklist-group').forEach(g => syncSelectAll_(g));
}

function groupBoxes_(groupEl){
  return Array.from(groupEl.querySelectorAll('[data-checklist-check]'));
}

function applyChecked_(cb){
  cb.closest('.checklist-item').classList.toggle('checked', cb.checked);
}

function persistChecklistCheck_(cb){
  const type = cb.dataset.checklistCheck, key = cb.dataset.key, checked = cb.checked;
  // Notes are no longer editable here, so carry any already-stored note through untouched.
  const note = storedChecklistNote_(type, key);
  setLocalChecklist_(type, key, checked, note);
  return apiPost({ action: "saveChecklistItem", accountId: selectedAccountId, checklist: type, itemKey: key, checked, note })
    .catch(err => console.error('Failed to save checklist item', type, key, err));
}

function storedChecklistNote_(type, key){
  const stored = storedChecklist_(type);
  try{ return (stored[key] ? JSON.parse(stored[key]).note : '') || ''; }catch(e){ return ''; }
}

function syncSelectAll_(groupEl){
  const master = groupEl.querySelector('[data-select-all]');
  const boxes = groupBoxes_(groupEl);
  const checkedCount = boxes.filter(b => b.checked).length;
  master.checked = boxes.length > 0 && checkedCount === boxes.length;
  master.indeterminate = checkedCount > 0 && checkedCount < boxes.length;
}

function setLocalChecklist_(type, key, checked, note){
  const section = 'checklist.'+type;
  if(!selectedAccountDetail.data[section]) selectedAccountDetail.data[section] = {};
  selectedAccountDetail.data[section][key] = JSON.stringify({checked, note});
}

/* ---------------- New account modal ---------------- */
function renderLocRows(){
  const wrap = document.getElementById('newAccountLocs');
  let rows = '';
  for(let i=0;i<newAccountLocRows;i++){
    rows += `<div class="loc-row"><input type="text" data-locinput placeholder="Location name"></div>`;
  }
  wrap.innerHTML = rows;
}

document.getElementById('btnNewAccount').addEventListener('click', () => {
  document.getElementById('newAccountModal').classList.add('show');
  document.getElementById('newAccountName').value = '';
  document.getElementById('newAccountRep').value = '';
  newAccountLocRows = 1;
  renderLocRows();
});
document.getElementById('btnCancelNew').addEventListener('click', () => {
  document.getElementById('newAccountModal').classList.remove('show');
});
document.getElementById('btnAddLocRow').addEventListener('click', () => {
  newAccountLocRows++;
  renderLocRows();
});
document.getElementById('btnCreateAccount').addEventListener('click', async () => {
  const name = document.getElementById('newAccountName').value.trim();
  const csRep = document.getElementById('newAccountRep').value.trim();
  const locations = Array.from(document.querySelectorAll('[data-locinput]')).map(i=>i.value.trim()).filter(Boolean);
  if(!name){ alert('Give the account a name first.'); return; }
  if(!endpointReady()){ alert("Connect this page to your Apps Script Web App URL in account-hub.js first."); return; }
  const btn = document.getElementById('btnCreateAccount');
  btn.disabled = true; btn.textContent = 'Creating…';
  const res = await apiPost({ action: "createAccount", name, csRep, locations });
  btn.disabled = false; btn.textContent = 'Create account';
  if(res.ok){
    document.getElementById('newAccountModal').classList.remove('show');
    await loadAccounts();
    selectAccount(res.account.accountId);
  } else {
    alert('Could not create account: ' + res.error);
  }
});

/* ---------------- Search ---------------- */
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderAccountList();
});

/* ---------------- Utility ---------------- */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Init ---------------- */
loadAccounts();

</script>
