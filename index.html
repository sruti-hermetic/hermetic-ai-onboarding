<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermetic AI — Onboarding</title>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/general-sans">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/jetbrains-mono">
<style>
/* ============================================================
   HERMETIC AI — PRIMA DESIGN SYSTEM TOKENS
   ============================================================ */
:root{
  --venue-blue: oklch(0.432 0.193 267);
  --venue-blue-hover: oklch(0.380 0.176 267);
  --venue-blue-deep: oklch(0.320 0.149 267);
  --venue-blue-tint: oklch(0.965 0.017 275);
  --night-ink: oklch(0.198 0.017 257);
  --evening-slate: oklch(0.375 0.039 257);
  --mid-slate: oklch(0.556 0.040 257);
  --border-default: oklch(0.859 0.025 255);
  --border-subtle: oklch(0.926 0.013 255);
  --clean-linen: oklch(0.984 0.003 248);
  --canvas: oklch(1 0 0);
  --fresh-teal: oklch(0.620 0.104 184);
  --evening-violet: oklch(0.464 0.211 289);
  --warm-amber: oklch(0.554 0.130 59);
  --success-green: oklch(0.525 0.137 150);
  --alert-red: oklch(0.531 0.218 29);

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  --sp-2: 2px; --sp-4: 4px; --sp-6: 6px; --sp-8: 8px; --sp-10: 10px;
  --sp-12: 12px; --sp-16: 16px; --sp-20: 20px; --sp-24: 24px;
  --sp-32: 32px; --sp-40: 40px; --sp-48: 48px; --sp-56: 56px;

  --font-sans: 'General Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: var(--font-sans);
  background: var(--clean-linen);
  color: var(--night-ink);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4,p,ul,ol{ margin:0; padding:0; }
button{ font-family: inherit; }
input,select,textarea{ font-family: inherit; letter-spacing: -0.01em; }

/* Typography scale */
.t-display{ font-size:24px; font-weight:600; line-height:1.3; }
.t-headline{ font-size:20px; font-weight:600; line-height:1.4; }
.t-title{ font-size:16px; font-weight:600; line-height:1.5; }
.t-body{ font-size:14px; font-weight:400; line-height:1.5; }
.t-label{ font-size:14px; font-weight:500; line-height:1.5; }
.t-caption{ font-size:12px; font-weight:400; line-height:1.5; color: var(--mid-slate); }
.t-overline{ font-size:12px; font-weight:600; line-height:1.5; text-transform:uppercase; letter-spacing:0.04em; color: var(--mid-slate); }

/* ============================================================
   HERO
   ============================================================ */
.hero{
  width:100%;
  display:block;
  line-height:0;
}
.hero img{ width:100%; height:auto; display:block; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app{
  max-width: 1180px;
  margin: 0 auto;
  padding: var(--sp-40) var(--sp-24) 120px;
  display:grid;
  grid-template-columns: 240px 1fr;
  gap: var(--sp-40);
  align-items:start;
}
@media (max-width: 860px){
  .app{ grid-template-columns: 1fr; padding: var(--sp-24) var(--sp-16) 100px; }
  .sidebar{ display:none; }
}

/* Sidebar step nav */
.sidebar{
  position: sticky;
  top: var(--sp-40);
  display:flex;
  flex-direction:column;
  gap: var(--sp-2);
}
.sidebar .kicker{
  padding: 0 var(--sp-12) var(--sp-12);
}
.step-nav-item{
  display:flex;
  align-items:center;
  gap: var(--sp-10);
  padding: var(--sp-10) var(--sp-12);
  border-radius: var(--radius-md);
  cursor:pointer;
  color: var(--evening-slate);
  font-size:14px;
  font-weight:500;
  transition: background .12s ease, color .12s ease;
  user-select:none;
}
.step-nav-item:hover{ background: var(--border-subtle); }
.step-nav-item.active{ background: var(--venue-blue-tint); color: var(--venue-blue-deep); }
.step-nav-item .num{
  width:20px; height:20px; border-radius: var(--radius-full);
  background: var(--border-subtle); color: var(--mid-slate);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600; flex-shrink:0;
}
.step-nav-item.active .num{ background: var(--venue-blue); color: var(--canvas); }
.step-nav-item.done .num{ background: var(--success-green); color: var(--canvas); }
.step-nav-item.done .num::before{ content:"✓"; }
.step-nav-item.done .num span{ display:none; }

/* Main content card */
.main{ min-width:0; }
.panel{
  background: var(--canvas);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  padding: var(--sp-32);
}
@media (max-width:600px){ .panel{ padding: var(--sp-20); } }

.panel-head{ margin-bottom: var(--sp-24); }
.panel-head .t-overline{ margin-bottom: var(--sp-6); }
.panel-head .t-display{ margin-bottom: var(--sp-6); }
.panel-head .t-body{ color: var(--evening-slate); }

/* Field groups */
.field{ margin-bottom: var(--sp-24); }
.field:last-child{ margin-bottom:0; }
.field label.t-label{ display:block; margin-bottom: var(--sp-8); color: var(--night-ink); }
.field .hint{ margin-top: var(--sp-6); }
.field .req{ color: var(--alert-red); margin-left:2px; }

input[type=text], input[type=email], input[type=tel], input[type=url], input[type=number], input[type=date], textarea, select{
  width:100%;
  border:1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--sp-10) var(--sp-12);
  font-size:14px;
  color: var(--night-ink);
  background: var(--canvas);
  outline: none;
  transition: border-color .12s ease, box-shadow .12s ease;
}
textarea{ resize:vertical; min-height:88px; }
input:focus, select:focus, textarea:focus{
  border-color: var(--venue-blue);
  box-shadow: 0 0 0 3px var(--venue-blue-tint);
}
input::placeholder, textarea::placeholder{ color: var(--mid-slate); }

/* Choice cards (radio/checkbox styled) */
.choice-group{ display:flex; flex-direction:column; gap: var(--sp-8); }
.choice-group.row{ flex-direction:row; flex-wrap:wrap; }
.choice{
  display:flex;
  align-items:flex-start;
  gap: var(--sp-10);
  border:1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: var(--sp-12) var(--sp-16);
  cursor:pointer;
  transition: border-color .12s ease, background .12s ease;
}
.choice:hover{ border-color: var(--venue-blue); }
.choice.selected{ border-color: var(--venue-blue); background: var(--venue-blue-tint); }
.choice input{ margin-top:2px; accent-color: var(--venue-blue); flex-shrink:0; width:16px;height:16px; }
.choice .choice-text{ font-size:14px; color: var(--night-ink); }
.choice .choice-sub{ font-size:12px; color: var(--mid-slate); margin-top:2px; }

/* Toggle pill (yes/no, same-for-all) */
.pill-toggle{ display:inline-flex; border:1px solid var(--border-default); border-radius: var(--radius-full); padding:2px; gap:2px; }
.pill-toggle button{
  border:none; background:transparent; padding: var(--sp-8) var(--sp-16);
  border-radius: var(--radius-full); font-size:13px; font-weight:500; color: var(--evening-slate); cursor:pointer;
}
.pill-toggle button.active{ background: var(--venue-blue); color: var(--canvas); }

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap: var(--sp-8);
  border-radius: var(--radius-md); border:1px solid transparent;
  font-size:14px; font-weight:500; padding: var(--sp-10) var(--sp-20);
  cursor:pointer; transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.btn-primary{ background: var(--venue-blue); color: var(--canvas); }
.btn-primary:hover{ background: var(--venue-blue-hover); }
.btn-primary:disabled{ background: var(--border-default); color: var(--mid-slate); cursor:not-allowed; }
.btn-ghost{ background: transparent; color: var(--evening-slate); border-color: var(--border-default); }
.btn-ghost:hover{ background: var(--border-subtle); }
.btn-text{ background:transparent; color: var(--venue-blue); padding: var(--sp-8) var(--sp-4); }
.btn-text:hover{ text-decoration: underline; }
.btn-danger-text{
  display:inline-flex; align-items:center; justify-content:center;
  background:transparent; color: var(--alert-red);
  border:1px solid var(--alert-red); border-radius: var(--radius-md);
  gap: var(--sp-6); padding: var(--sp-6) var(--sp-12); font-size:13px; font-weight:500;
  cursor:pointer; transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.btn-danger-text:hover{ background: var(--alert-red); color: var(--canvas); }
.btn-sm{ padding: var(--sp-6) var(--sp-12); font-size:13px; }

/* Repeater rows */
.repeater-row{
  border:1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--sp-16);
  margin-bottom: var(--sp-12);
  background: var(--clean-linen);
}
.repeater-row-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--sp-12); }

/* Section divider */
.divider{ height:1px; background: var(--border-subtle); margin: var(--sp-24) 0; }

/* Conditional block */
.subblock{
  margin-top: var(--sp-12);
  padding-left: var(--sp-16);
  border-left: 2px solid var(--border-subtle);
}

/* Badges */
.badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:12px; font-weight:500; padding: 2px 8px; border-radius: var(--radius-sm);
}
.badge-blue{ background: var(--venue-blue-tint); color: var(--venue-blue-deep); }
.badge-teal{ background: oklch(0.620 0.104 184 / 0.14); color: var(--fresh-teal); }

/* File upload */
.file-drop{
  border:1.5px dashed var(--border-default);
  border-radius: var(--radius-lg);
  padding: var(--sp-20);
  text-align:center;
  cursor:pointer;
  transition: border-color .12s ease, background .12s ease;
}
.file-drop:hover{ border-color: var(--venue-blue); background: var(--venue-blue-tint); }
.file-drop input{ display:none; }
.file-list{ margin-top: var(--sp-8); display:flex; flex-direction:column; gap: var(--sp-6); }
.file-chip{
  display:flex; align-items:center; justify-content:space-between;
  border:1px solid var(--border-default); border-radius: var(--radius-md);
  padding: var(--sp-8) var(--sp-12); font-size:13px;
}
.file-chip .name{ color: var(--night-ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-chip .remove{ color: var(--alert-red); cursor:pointer; font-size:12px; flex-shrink:0; margin-left:8px; }

/* Location tabs */
.loc-tabs{ display:flex; gap: var(--sp-8); flex-wrap:wrap; margin-bottom: var(--sp-20); }
.loc-tab{
  padding: var(--sp-8) var(--sp-16); border-radius: var(--radius-full);
  border:1px solid var(--border-default); font-size:13px; font-weight:500; cursor:pointer; color: var(--evening-slate);
}
.loc-tab.active{ border-color: var(--venue-blue); background: var(--venue-blue-tint); color: var(--venue-blue-deep); }

/* Copy-from banner */
.copy-banner{
  display:flex; align-items:center; justify-content:space-between; gap: var(--sp-12);
  background: var(--venue-blue-tint); border-radius: var(--radius-lg);
  padding: var(--sp-12) var(--sp-16); margin-bottom: var(--sp-20);
}
.copy-banner select{ width:auto; }

/* Footer nav */
.footer-nav{
  display:flex; justify-content:space-between; align-items:center;
  margin-top: var(--sp-32);
}
.progress-track{
  height:4px; background: var(--border-subtle); border-radius: var(--radius-full); overflow:hidden; margin-bottom: var(--sp-32);
}
.progress-fill{ height:100%; background: var(--venue-blue); transition: width .2s ease; }

/* Review screen */
.review-section{ margin-bottom: var(--sp-24); }
.review-section .t-title{ margin-bottom: var(--sp-12); padding-bottom:var(--sp-8); border-bottom:1px solid var(--border-subtle); }
.review-row{ display:flex; justify-content:space-between; gap:var(--sp-16); padding: var(--sp-6) 0; font-size:13px; }
.review-row .k{ color: var(--mid-slate); flex-shrink:0; }
.review-row .v{ color: var(--night-ink); text-align:right; }

/* Toast / submit state */
.status-banner{
  border-radius: var(--radius-lg); padding: var(--sp-16); margin-bottom: var(--sp-20);
  font-size:14px; display:none;
}
.status-banner.show{ display:block; }
.status-error{ background: oklch(0.531 0.218 29 / 0.08); color: var(--alert-red); border:1px solid oklch(0.531 0.218 29 / 0.3); }
.status-success{ background: oklch(0.525 0.137 150 / 0.08); color: var(--success-green); border:1px solid oklch(0.525 0.137 150 / 0.3); }

/* Success screen */
.success-screen{ text-align:center; padding: var(--sp-48) var(--sp-24); }
.success-icon{
  width:56px; height:56px; border-radius: var(--radius-full);
  background: oklch(0.525 0.137 150 / 0.12); color: var(--success-green);
  display:flex; align-items:center; justify-content:center; margin:0 auto var(--sp-20);
  font-size:24px;
}

.mono{ font-family: var(--font-mono); font-size:12px; }
</style>
</head>

<div class="app">
  <!-- SIDEBAR STEP NAV -->
  <nav class="sidebar" id="sidebarNav"></nav>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="status-banner status-error" id="errorBanner"></div>
    <form id="onboardForm" onsubmit="return false;">
      <div class="panel" id="stepPanel"></div>
    </form>
  </main>
</div>

<script>
/* ============================================================
   HERMETIC AI — CUSTOMER ONBOARDING FORM
   Vanilla JS, no build step. Submits JSON to a Google Apps
   Script Web App endpoint (see CONFIG.ENDPOINT_URL).
   ============================================================ */

const CONFIG = {
  // Paste your deployed Apps Script Web App /exec URL here.
  ENDPOINT_URL: "https://script.google.com/macros/s/AKfycbwIRubWd-gnfi6bB19Wl4z8vxV_KyS1-0IB6q__YX4ETZVWGxJ80UmJMvqReCSMyg5UZw/exec",
  MAX_FILE_MB: 15
};

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

/* ---------------- STATE ---------------- */
let FD = {
  integration: { system: "", tripleseatConfirmed: false },
  locations: [ { id: uid(), name: "" } ],
  naming: {},          // { locId: { choice: 'Mia'|'custom', custom:'' } }
  handoff: { sameForAll: true, shared: {}, perLoc: {} },
  sharing: { sameForAll: true, shared: {}, perLoc: {} },
  locConfig: {},        // { locId: {...} }
  special: { sameForAll: true, shared: {}, perLoc: {}, tone: {} },
  addons: {}
};

let step = 1;
let activeTab = {}; // per-section active location tab id, e.g. activeTab.handoff = locId

const STEPS = [
  { id: 1, key: "integration", label: "AI agent integration" },
  { id: 2, key: "locations", label: "Locations" },
  { id: 3, key: "naming", label: "AI agent naming" },
  { id: 4, key: "handoff", label: "Handoff & routing" },
  { id: 5, key: "sharing", label: "What Mia can share" },
  { id: 6, key: "locConfig", label: "Location config" },
  { id: 7, key: "special", label: "Special instructions" },
  { id: 8, key: "addons", label: "Optional add-ons" },
  { id: 9, key: "review", label: "Review & submit" },
];

/* ---------------- HELPERS ---------------- */
function uid(){ return 'l' + Math.random().toString(36).slice(2,9); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
function setPath(obj, path, val){
  const keys = path.split('.');
  let o = obj;
  for(let i=0;i<keys.length-1;i++){
    if(o[keys[i]] === undefined) o[keys[i]] = {};
    o = o[keys[i]];
  }
  o[keys[keys.length-1]] = val;
}
function locName(id){
  const l = FD.locations.find(x=>x.id===id);
  return l ? (l.name || "Unnamed location") : id;
}
function otherLocations(currentId){
  return FD.locations.filter(l => l.id !== currentId && l.name.trim());
}

/* ---------------- RENDER SHELL ---------------- */
function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = `<div class="kicker t-overline">Onboarding</div>` + STEPS.map(s => `
    <div class="step-nav-item ${s.id===step?'active':''} ${s.id<step?'done':''}" data-step="${s.id}">
      <div class="num"><span>${s.id}</span></div>
      <div>${esc(s.label)}</div>
    </div>
  `).join('');
  nav.querySelectorAll('.step-nav-item').forEach(el => {
    el.addEventListener('click', () => { step = parseInt(el.dataset.step); renderAll(); window.scrollTo({top:0, behavior:'smooth'}); });
  });
}

function renderProgress(){
  const pct = Math.round(((step-1) / (STEPS.length-1)) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderAll(){
  renderSidebar();
  renderProgress();
  const panel = document.getElementById('stepPanel');
  panel.innerHTML = renderStep();
  bindStepEvents();
  hideError();
}

function showError(msg){
  const b = document.getElementById('errorBanner');
  b.textContent = msg;
  b.classList.add('show');
}
function hideError(){
  document.getElementById('errorBanner').classList.remove('show');
}

/* ---------------- FIELD BUILDERS (return HTML strings) ---------------- */
function fieldWrap(labelText, required, inner, hint){
  return `<div class="field">
    <label class="t-label">${esc(labelText)}${required?'<span class="req">*</span>':''}</label>
    ${inner}
    ${hint? `<div class="t-caption hint">${hint}</div>`:''}
  </div>`;
}

function textInput(path, placeholder, type){
  type = type || 'text';
  const val = getPath(FD, path) || '';
  return `<input type="${type}" data-bind="${path}" value="${esc(val)}" placeholder="${esc(placeholder||'')}">`;
}

function textarea(path, placeholder){
  const val = getPath(FD, path) || '';
  return `<textarea data-bind="${path}" placeholder="${esc(placeholder||'')}">${esc(val)}</textarea>`;
}

function radioGroup(path, options, opts){
  opts = opts || {};
  const val = getPath(FD, path);
  return `<div class="choice-group ${opts.row?'row':''}">` + options.map(o => {
    const optVal = typeof o === 'string' ? o : o.value;
    const optLabel = typeof o === 'string' ? o : o.label;
    const optSub = typeof o === 'object' ? o.sub : null;
    const selected = val === optVal;
    return `<label class="choice ${selected?'selected':''}">
      <input type="radio" name="${path}" data-bind-radio="${path}" value="${esc(optVal)}" ${selected?'checked':''}>
      <div><div class="choice-text">${esc(optLabel)}</div>${optSub?`<div class="choice-sub">${optSub}</div>`:''}</div>
    </label>`;
  }).join('') + `</div>`;
}

function selectInput(path, options, placeholder){
  const val = getPath(FD, path) || '';
  return `<select data-bind="${path}">
    <option value="" ${!val?'selected':''} disabled>${esc(placeholder||'Select…')}</option>
    ${options.map(o=>{
      const optVal = typeof o==='string'?o:o.value, optLabel = typeof o==='string'?o:o.label;
      return `<option value="${esc(optVal)}" ${val===optVal?'selected':''}>${esc(optLabel)}</option>`;
    }).join('')}
  </select>`;
}

function pillToggle(path, leftLabel, rightLabel, leftVal, rightVal){
  const val = getPath(FD, path);
  const isLeft = val === leftVal || val === undefined || val === true && leftVal===true;
  return `<div class="pill-toggle" data-pill="${path}" data-left="${leftVal}" data-right="${rightVal}">
    <button type="button" class="${val!==false && (val===leftVal||val===undefined)?'active':''}" data-val="${leftVal}">${esc(leftLabel)}</button>
    <button type="button" class="${val===rightVal?'active':''}" data-val="${rightVal}">${esc(rightLabel)}</button>
  </div>`;
}

function fileDrop(path, tagLabel, required){
  const files = getPath(FD, path) || [];
  return `<div>
    <label class="file-drop" data-filedrop="${path}">
      <input type="file" data-filepick="${path}" multiple>
      <div class="t-body" style="color:var(--evening-slate)">Click to upload${tagLabel? ' — '+esc(tagLabel):''}</div>
      <div class="t-caption">PDF, image, or doc · up to ${CONFIG.MAX_FILE_MB}MB each</div>
    </label>
    <div class="file-list">
      ${files.map((f,i)=>`<div class="file-chip"><span class="name">${esc(f.name)}</span><span class="remove" data-fileremove="${path}" data-idx="${i}">Remove</span></div>`).join('')}
    </div>
  </div>`;
}

function repeaterAddBtn(path, label){
  return `<button type="button" class="btn btn-ghost btn-sm" data-repeater-add="${path}">+ ${esc(label)}</button>`;
}
function repeaterRemoveBtn(path, idx){
  return `<button type="button" class="btn-danger-text" data-repeater-remove="${path}" data-idx="${idx}">× Remove</button>`;
}

function copyFromBanner(sectionKey, currentLocId){
  const others = otherLocations(currentLocId).filter(l => (FD[sectionKey].perLoc[l.id]));
  if(!others.length) return '';
  return `<div class="copy-banner">
    <div class="t-body">Start from another location's answers?</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <select id="copySrc_${sectionKey}">
        <option value="">Start fresh</option>

function locationTabs(sectionKey){
  const named = FD.locations.filter(l=>l.name.trim());
  if(!activeTab[sectionKey] || !named.find(l=>l.id===activeTab[sectionKey])){

  }
  if(!named.length) return `<div class="t-caption">Add at least one location in Step 2 to continue.</div>`;
  return `<div class="loc-tabs">${named.map(l=>`
    <div class="loc-tab ${activeTab[sectionKey]===l.id?'active':''}" data-loctab="${sectionKey}" data-locid="${l.id}">${esc(l.name)}</div>
  `).join('')}</div>`;
}

    </div>
    <div class="review-section">
      <div class="t-title">Locations (${named.length})</div>
      ${named.map(l=>`<div class="review-row"><div class="k">•</div><div class="v">${esc(l.name)}</div></div>`).join('') || '<div class="t-caption">None added</div>'}
    </div>
    <div class="review-section">
      <div class="t-title">Handoff & routing</div>
      <div class="review-row"><div class="k">Same for all locations</div><div class="v">${FD.handoff.sameForAll?'Yes':'No — set per location'}</div></div>
    </div>
    <div class="review-section">
      <div class="t-title">What Mia can share</div>
      <div class="review-row"><div class="k">Same for all locations</div><div class="v">${FD.sharing.sameForAll?'Yes':'No — set per location'}</div></div>
    </div>
    <div class="review-section">
      <div class="t-title">Add-ons</div>
      <div class="review-row"><div class="k">Mia Voice</div><div class="v">${esc(FD.addons.voice||'—')}</div></div>
      <div class="review-row"><div class="k">Automatic menu generation</div><div class="v">${esc(FD.addons.menuGen||'—')}</div></div>
      <div class="review-row"><div class="k">Post-event nurture</div><div class="v">${esc(FD.addons.nurture||'—')}</div></div>
    </div>
    <div class="t-caption" style="margin-top:8px;">Full detail for every section is included in the submission — this is a quick summary, not the whole record.</div>
    ` + footerNav();
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindStepEvents(){
  const panel = document.getElementById('stepPanel');

  // plain text/textarea/select bound inputs
  panel.querySelectorAll('[data-bind]').forEach(el => {
    el.addEventListener('input', () => {
      setPath(FD, el.dataset.bind, el.value);
    });
    el.addEventListener('change', () => {
      setPath(FD, el.dataset.bind, el.value);
    });
  });

  // radio groups bound via data-bind-radio
  panel.querySelectorAll('[data-bind-radio]').forEach(el => {
    el.addEventListener('change', () => {
      setPath(FD, el.dataset.bindRadio, el.value);
      renderStepInPlace();
    });
  });

  // checkboxes bound via data-bind-check
  panel.querySelectorAll('[data-bind-check]').forEach(el => {
    el.addEventListener('change', () => {
      setPath(FD, el.dataset.bindCheck, el.checked);
      renderStepInPlace();
    });
  });

  // day chip multi-selects
  panel.querySelectorAll('[data-daychip]').forEach(el => {
    el.addEventListener('change', () => {
      const path = el.dataset.daychip;
      let arr = getPath(FD, path) || [];
      if(el.checked){ if(!arr.includes(el.value)) arr.push(el.value); }
      else{ arr = arr.filter(d=>d!==el.value); }
      setPath(FD, path, arr);
      renderStepInPlace();
    });
  });

  // multiselect checkboxes (e.g. sister venues) storing array of ids
  panel.querySelectorAll('[data-multiselect]').forEach(el => {
    el.addEventListener('change', () => {
      const path = el.dataset.multiselect;
      let arr = getPath(FD, path) || [];
      if(el.checked){ if(!arr.includes(el.value)) arr.push(el.value); }
      else{ arr = arr.filter(v=>v!==el.value); }
      setPath(FD, path, arr);
      renderStepInPlace();
    });
  });

  // pill toggles (Yes/No style, string values)
  panel.querySelectorAll('[data-pill]').forEach(pill => {
    pill.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const path = pill.dataset.pill;
        let v = btn.dataset.val;
        if(v==='true') v = true; else if(v==='false') v = false;
        setPath(FD, path, v);
        renderStepInPlace();
      });
    });
  });

  // same-for-all pills (boolean, section-level)
  panel.querySelectorAll('[data-samepill]').forEach(pill => {
    pill.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const sectionKey = pill.dataset.samepill;
        FD[sectionKey].sameForAll = (btn.dataset.val === 'true');
        renderStepInPlace();
      });
    });
  });

  // location tabs
  panel.querySelectorAll('[data-loctab]').forEach(tab => {
    tab.addEventListener('click', () => {
      activeTab[tab.dataset.loctab] = tab.dataset.locid;
      renderStepInPlace();
    });
  });

  // copy-from-location
  panel.querySelectorAll('[data-copyfrom]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sectionKey = btn.dataset.copyfrom;
      const targetId = btn.dataset.target;
      const sel = document.getElementById('copySrc_'+sectionKey);
      const srcId = sel.value;
      if(!srcId) return;
      FD[sectionKey].perLoc[targetId] = JSON.parse(JSON.stringify(FD[sectionKey].perLoc[srcId] || {}));
      renderStepInPlace();
    });
  });

  // repeater add
  panel.querySelectorAll('[data-repeater-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const path = btn.dataset.repeaterAdd;
      const arr = getPath(FD, path) || [];
      // shape depends on which repeater — infer a sensible blank row
      let blank = {};
      if(path.endsWith('coordinators')) blank = {name:'',email:''};
      else if(path.endsWith('closures')) blank = {start:'',end:'',reason:''};
      else if(path.endsWith('docs')) blank = {tag:'',files:[]};
      else if(path.endsWith('roomRules')) blank = {room:'',when:'',days:[]};
      else if(path.endsWith('pricingExceptions')) blank = {target:'',rule:''};
      else if(path.endsWith('carveOuts')) blank = {situation:'',instruction:''};
      arr.push(blank);
      setPath(FD, path, arr);
      renderStepInPlace();
    });
  });

  // repeater remove
  panel.querySelectorAll('[data-repeater-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const path = btn.dataset.repeaterRemove;
      const idx = parseInt(btn.dataset.idx);
      const arr = getPath(FD, path) || [];
      arr.splice(idx,1);
      setPath(FD, path, arr);
      renderStepInPlace();
    });
  });

  // naming (step 3) special bindings
  panel.querySelectorAll('[data-naming-choice]').forEach(el => {
    el.addEventListener('change', () => {
      const locId = el.dataset.namingChoice;
      FD.naming[locId] = FD.naming[locId] || {choice:'Mia',custom:''};
      FD.naming[locId].choice = el.value;
      renderStepInPlace();
    });
  });
  panel.querySelectorAll('[data-naming-custom]').forEach(el => {
    el.addEventListener('input', () => {
      const locId = el.dataset.namingCustom;
      FD.naming[locId] = FD.naming[locId] || {choice:'custom',custom:''};
      FD.naming[locId].custom = el.value;
    });
  });

  // locations repeater (step 2)
  panel.querySelectorAll('[data-locname]').forEach(el => {
    el.addEventListener('input', () => {
      const loc = FD.locations.find(l=>l.id===el.dataset.locname);
      if(loc) loc.name = el.value;
    });
  });
  panel.querySelectorAll('[data-locremove]').forEach(el => {
    el.addEventListener('click', () => {
      FD.locations = FD.locations.filter(l=>l.id!==el.dataset.locremove);
      renderStepInPlace();
    });
  });
  const addLocBtn = document.getElementById('btnAddLoc');
  if(addLocBtn) addLocBtn.addEventListener('click', () => {
    FD.locations.push({id: uid(), name:''});
    renderStepInPlace();
  });

  // file uploads
  panel.querySelectorAll('[data-filepick]').forEach(el => {
    el.addEventListener('change', async () => {
      const path = el.dataset.filepick;
      const existing = getPath(FD, path) || [];
      for(const file of el.files){
        if(file.size > CONFIG.MAX_FILE_MB * 1024 * 1024){
          showError(`"${file.name}" is over ${CONFIG.MAX_FILE_MB}MB — please use a smaller file.`);
          continue;
        }
        const dataUrl = await fileToDataUrl(file);
        existing.push({ name: file.name, type: file.type, size: file.size, dataUrl });
      }
      setPath(FD, path, existing);
      renderStepInPlace();
    });
  });
  panel.querySelectorAll('[data-fileremove]').forEach(el => {
    el.addEventListener('click', () => {
      const path = el.dataset.fileremove;
      const idx = parseInt(el.dataset.idx);
      const arr = getPath(FD, path) || [];
      arr.splice(idx,1);
      setPath(FD, path, arr);
      renderStepInPlace();
    });
  });

  // nav buttons
  const back = document.getElementById('btnBack');
  if(back) back.addEventListener('click', () => { if(step>1){ step--; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }});
  const next = document.getElementById('btnNext');
  if(next) next.addEventListener('click', () => {
    const err = validateStep();
    if(err){ showError(err); return; }
    if(step<STEPS.length){ step++; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
  });
  const submit = document.getElementById('btnSubmit');
  if(submit) submit.addEventListener('click', doSubmit);
}

function renderStepInPlace(){
  const panel = document.getElementById('stepPanel');
  panel.innerHTML = renderStep();
  bindStepEvents();
}

function fileToDataUrl(file){
  return new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ---------------- VALIDATION ---------------- */
function validateStep(){
  const key = STEPS[step-1].key;
  if(key==='integration'){
    if(!FD.integration.system) return "Pick which system you're integrating with.";
    if(FD.integration.system==='Tripleseat' && !FD.integration.tripleseatConfirmed) return "Please confirm Steps 1–3 in Tripleseat are complete before continuing.";
  }
  if(key==='locations'){
    if(!FD.locations.some(l=>l.name.trim())) return "Add at least one location.";
  }
  return null;
}

/* ---------------- SUBMIT ---------------- */
async function doSubmit(){
  hideError();
  if(!CONFIG.ENDPOINT_URL || CONFIG.ENDPOINT_URL.includes('PASTE_YOUR')){
    showError("This form isn't connected to a submission endpoint yet. See SETUP_INSTRUCTIONS.md.");
    return;
  }
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  try{
    const res = await fetch(CONFIG.ENDPOINT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
      body: JSON.stringify(FD)
    });
    const result = await res.json().catch(()=>({ok:true}));
    if(result.ok === false) throw new Error(result.error || 'Submission failed');
    showSuccessScreen();
  }catch(e){
    showError("Something went wrong submitting the form: " + e.message + ". Please try again.");
    btn.disabled = false;
    btn.textContent = 'Submit onboarding';
  }
}

function showSuccessScreen(){
  document.getElementById('stepPanel').innerHTML = `
    <div class="success-screen">
      <div class="success-icon">✓</div>
      <div class="t-display" style="margin-bottom:8px;">You're all set</div>
      <div class="t-body" style="color:var(--evening-slate);">Thanks — we've received your onboarding details. Our team will follow up shortly to finish setting up Mia.</div>
    </div>`;
  document.getElementById('progressFill').style.width = '100%';
}

/* ---------------- INIT ---------------- */
renderAll();

</script>
